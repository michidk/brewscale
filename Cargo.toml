[workspace]
resolver = "2"
members = ["brewscale-core", "brewscale", "brewscale-trouble"]
# Built separately: needs the riscv32imc target and its own .cargo/config.toml.
exclude = ["examples/esp32c3"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/michidk/brewscale"
homepage = "https://github.com/michidk/brewscale"

[package]
name = "brewscale-core"
description = "Vendor-neutral, no_std and allocation-free core for BLE coffee-scale drivers: protocol and transport traits plus the Scale driver"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["no-std", "ble", "scale", "coffee", "embedded"]
categories = ["embedded", "no-std::no-alloc", "hardware-support"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Implements std::error::Error for the error types.
std = []
# In-memory Transport used by the shared protocol/driver tests (no_std too).
mock = []

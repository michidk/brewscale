[package]
name = "brewscale-bookoo"
description = "BOOKOO Themis Mini/Ultra BLE protocol drivers for brewscale (no_std, no alloc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["no-std", "ble", "scale", "bookoo", "coffee"]
categories = ["embedded", "no-std::no-alloc", "hardware-support"]

[dependencies]
brewscale-core = { version = "0.1.0", path = "../brewscale-core", default-features = false }

[features]
default = []
# Implements std::error::Error for the error types.
std = ["brewscale-core/std"]
